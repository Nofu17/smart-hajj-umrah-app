name: smart_hajj_umrah_app
description: "A Smart Hajj and Umrah Guide Application"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.1.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Firebase (الأساس لتتبع المجموعة والـ SOS)
  firebase_core: ^3.1.1
  firebase_auth: ^5.1.1
  cloud_firestore: ^5.0.2
  firebase_messaging: ^15.0.2

  # الحفظ المحلي (أساس حفظ الجلسة)
  shared_preferences: ^2.2.3  # إصدار مستقر جداً
  sqflite: ^2.3.0
  path_provider: ^2.1.2
  path: ^1.9.0

  # الخرائط وتتبع الأعضاء
  flutter_map: ^6.1.0
  latlong2: ^0.9.0
  geolocator: ^11.0.0 # تحديث بسيط لضمان دعم أندرويد 14

  # QR Code (للانضمام للمجموعة)
  qr_flutter: ^4.1.0
  mobile_scanner: ^5.1.0

  # بوصلة القبلة
  flutter_compass: ^0.8.0
  adhan: ^2.0.0+1

  # الإشعارات (لتنبيه SOS)
  flutter_local_notifications: ^17.1.2
  timezone: ^0.9.4
  permission_handler: ^11.3.1

  # مكتبة البروفايدر لإدارة بيانات التطبيق ومزامنة مواقع الحجاج بين الصفحات
  provider: ^6.1.1

  # واجهة المستخدم والمميزات الأخرى
  cupertino_icons: ^1.0.8
  flutter_localizations:
    sdk: flutter
  cached_network_image: ^3.3.1
  url_launcher: ^6.2.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0 # تحديث للـ lints

flutter:
  uses-material-design: true
  # لا تنسي إضافة الخطوط هنا إذا كنتِ تستخدمين Cairo أو Poppins
 # fonts:
  #  - family: Cairo
    #  fonts:
     #   - asset: assets/fonts/Cairo-Regular.ttf
     #   - asset: assets/fonts/Cairo-Bold.ttf
      #    weight: 700